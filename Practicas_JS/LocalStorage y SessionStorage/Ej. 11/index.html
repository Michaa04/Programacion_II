<body>
    <h1>Ejercicio 11: Guardar y mostrar el progreso de lectura</h1>
    <p><b>Consigna:</b> Crea una página que permita al usuario guardar su progreso de lectura (porcentaje) en
    LocalStorage y mostrarlo al recargar la página.</p> 
    <hr>
    <h2>Progreso de lectura</h2>
    <label for="input-porcentaje">Porcentaje</label>
    <input type="number" id="input-porcentaje" placeholder="Ej: 45%">
    <button onclick="guardarProgreso()">Guardar Progreso</button>
    <p id="progreso-lectura"></p>
    <script src="script.js"></script>
</body>
