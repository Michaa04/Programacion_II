<body>
    <h1>Ejercicio 12: Guardar y mostrar la configuración de un formulario</h1>
    <p><b>Consigna:</b> Crea una página con un formulario que guarde los datos ingresados en LocalStorage y los
muestre al recargar la página.</p>
    <hr>
    <h2>Formulario de datos personales</h2>
    <form action="">
        <label for="input-name">Nombre:</label>
        <input type="text" id="input-name" placeholder="Ej: Pablo"><br>
        <label for="input-surname">Apellido</label>
        <input type="text" id="input-surname" placeholder="Ej: Suar"><br>
        <label for="input-age">Edad</label>
        <input type="number" id="input-age" placeholder="Ej: 18">
        <button type="button" onclick="guardarDatos()">Guardar</button>
        <script src="script.js"></script>
    </form>
</body>
